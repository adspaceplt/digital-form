<body class="ncpage">

<!-- A card handed over, not a page of the portal: no bar, no menu, the card
     alone on white, the way the signboard stands on its wall. -->
<main class="ncmain">
  <div class="pageload" role="status" aria-label="Loading"><span class="pageload-spin" aria-hidden="true"></span></div>
  <div id="ncHost" aria-live="polite"></div>
  <section class="cover" id="ncCover" data-shown hidden>
    <div class="cover-inner">
      <div class="cover-panel" data-glyph="userx">
        <!-- Drawn here, as js/icons.js draws `userx`: the namecard holds its
             request budget, so the notice never fetches the icon set. -->
        <span class="lockcard-mark" data-mark="userx" aria-hidden="true"><svg class="ic" data-ic="userx"></svg></span>
        <h2 id="ncCoverTitle"></h2>
        <p id="ncCoverText"></p>
        <!-- A visitor holding a namecard has no account manager: the office's
             own ways in (ux-audit CARD-2). -->
        <div class="cover-acts" id="ncCoverActs" hidden>
          <a class="btn" id="ncCoverSite" href="https://adspacestudios.com" target="_blank" rel="noopener">Visit website<svg aria-hidden="true" data-ic="out"></svg></a>
          <a class="btn btn-primary" id="ncCoverWa" href="https://wa.me/adspace" target="_blank" rel="noopener"><svg aria-hidden="true" data-ic="whatsapp"></svg>Chat on WhatsApp</a>
        </div>
      </div>
    </div>
  </section>
</main>

<!-- A namecard not found takes every page's bar and foot (the cover
     family, 2026-11-22); the card itself stands alone, so the chrome is
     drawn only with the notice (js/card.js clones this in). -->
<template id="ncChrome"><script src="/js/chrome.js?v=20261126gl" data-kicker="eNamecard"></script></template>
<script src="/js/card.js?v=20261122zzq"></script>
</body>
