<!DOCTYPE html>
<html lang="en" data-face="client" data-layout="v3">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Quotation · %agency.trading_name%</title>
<meta name="description" content="Prepare your quotation for social media, advertising and content services with %agency.trading_name%.">
<meta property="og:site_name" content="%agency.trading_name%">
<meta property="og:title" content="Quotation by %agency.trading_name%">
<meta property="og:description" content="Prepare your quotation for social media, advertising and content services with %agency.trading_name%.">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/png" sizes="192x192" href="/img/favicon-192.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="preload" as="font" type="font/woff2" href="/css/SlateRg.woff2" crossorigin>
<link rel="stylesheet" href="/css/portal.css?v=dev">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script src="/js/config.js?v=dev"></script>
<script src="/js/icons.js?v=dev"></script>
<script src="/js/captcha.js?v=dev"></script>
<script src="/js/words.js?v=dev"></script>
<script src="/js/clock.js?v=dev"></script>
<script src="/js/grow.js?v=dev"></script>
<script src="/js/form.js?v=dev"></script>
<script src="/js/api.js?v=dev"></script>
<script src="/js/money.js?v=dev"></script>
<script src="/js/maintenance.js?v=dev"></script>
<!-- The PDF scripts, fetched where a Download is drawn or pressed (js/chrome.js need). -->
<script type="application/json" id="lazyScripts">{
  "documents": {"src": "/js/documents.js?v=dev"},
  "quotepdf": {"src": "/js/quotepdf.js?v=dev", "first": ["documents"]}
}</script>
<script src="/js/seal.js?v=dev"></script>
</head>
<body class="qs-page">

<script src="/js/chrome.js?v=dev" data-kicker="Quotation" data-actions="lang"></script>

<!-- A prospect's own quotation (js/quote.js): five steps, then the
     quotation the database priced, Proceed and the Letter of Offer request. -->
<main class="shell qs" id="qsRoot" aria-live="polite">
  <div class="pageload" role="status" aria-label="Loading"><span class="pageload-spin" aria-hidden="true"></span></div>
</main>

<!-- How ad spend works (js/quote.js, 2026-11-27): the two ways the
     advertising budget is paid, an explainer with no choice. The sheet's
     mechanism is fetched on the first press (every visitor's weight). -->
<div class="sheet" id="adSheet" data-script="/js/sheet.js?v=dev" hidden>
  <div class="sheet-card adsheet" role="dialog" aria-modal="true" aria-labelledby="adHeading">
    <div class="sheet-head">
      <h3 id="adHeading"></h3>
      <button class="iconbtn" id="adClose" type="button" aria-label="Close"></button>
    </div>
    <div class="sheet-body" id="adBody"></div>
  </div>
</div>

<script src="/js/acts.js?v=dev"></script>
<script src="/js/quote.js?v=dev"></script>
</body>
</html>
