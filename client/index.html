<!DOCTYPE html>
<html lang="en" data-face="client">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>ADspace Client Portal</title>
<meta name="description" content="Your company, services, letters and requests with ADspace.">
<meta property="og:site_name" content="ADspace">
<meta property="og:title" content="Client Portal by ADspace">
<meta property="og:description" content="Your company, services, letters and requests with ADspace.">
<meta property="og:image" content="https://digital.adspace.me/img/share-1200.png?v=20261001a">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="ADspace Digital Portal">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" sizes="192x192" href="/img/favicon-192.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<!-- The one brand face, fetched alongside the stylesheet rather than after
     it: a heading that paints in the system face and flips a moment later
     is the page correcting itself in front of the reader. -->
<link rel="preload" as="font" type="font/woff2" href="/css/SlateRg.woff2" crossorigin>
<link rel="stylesheet" href="/css/portal.css?v=20261009o">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/js/config.js?v=20261007a"></script>
<script src="/js/captcha.js?v=20261001a"></script>
<script src="/js/words.js?v=20261009a"></script>
<script src="/js/copy.js?v=20261001a"></script>
<script src="/js/grow.js?v=20261008"></script>
<script src="/js/state.js?v=20261001a"></script>
<script src="/js/form.js?v=20261004b"></script>
<script src="/js/swipe.js?v=20261001a"></script>
<script src="/js/menu.js?v=20261009g"></script>
<script src="/js/guide.js?v=20261007j"></script>
<script src="/js/api.js?v=20261001a"></script>
<script src="/js/media.js?v=20261003b"></script>
<script src="/js/maintenance.js?v=20261009h"></script>
<script src="/js/announce.js?v=20261009h"></script>
<script src="/js/money.js?v=20261008p"></script>
<script src="/js/documents.js?v=20261007i"></script>
<script src="/js/smreport.js?v=20261007d"></script>
</head>
<body>

<script src="/js/chrome.js?v=20261001a" data-kicker="Client Portal" data-actions="lang"></script>

<template id="chromeExtra">
  <button class="pill" id="portalOut" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M12 4h6a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6"/></svg><span id="portalOutWord">Sign out</span></button>
</template>

<main class="shell">

  <section class="cover" id="stateBox" hidden>
    <div class="cover-inner">
      <div class="cover-panel">
        <h2 id="stateTitle"></h2>
        <p id="stateText"></p>
        <form id="signForm" hidden onsubmit="return false">
          <input class="input" id="signEmail" type="email" placeholder="email@adspace.me" autocomplete="email" aria-label="Email">
          <button class="btn btn-primary" id="signGo" type="button">Send code</button>
        </form>
        <!-- The email carries a code and a link. The code signs in here, which
             works where the link does not (an installed page, a mail app that
             opens links in its own browser, a link opened on another device). -->
        <form id="codeForm" hidden onsubmit="return false">
          <input class="input" id="signCode" type="text" inputmode="numeric" autocomplete="one-time-code"
                 maxlength="10" pattern="[0-9]*" spellcheck="false" aria-label="Code from the email" placeholder="Code">
          <button class="btn btn-primary" id="codeGo" type="button">Sign in</button>
        </form>
        <div class="msg" id="stateMsg"></div>
        <button class="btn btn-quiet cover-alt" id="codeBack" type="button" hidden>Use another email</button>
      </div>
    </div>
  </section>

  <div id="app" hidden>

    <!-- The page opens on who it is for: the console record's own head, the
         mark, the name with its registered name under it, and the one action
         on the right. Then one tab strip, and one pane at a time (the user,
         2026-09-28, choosing tabs like the console's records). -->
    <section class="panel rec-head" id="cpHead">
      <div class="rec-id">
        <span class="rec-mark" id="cpMark" aria-hidden="true"></span>
        <div class="rec-who">
          <div class="rec-name"><h2 id="cpName"></h2></div>
          <p class="rec-id-meta" id="cpMeta"></p>
        </div>
        <div class="rec-ctl">
          <span class="tone" id="cpState" hidden></span>
          <select class="select select-sm" id="clientPick" aria-label="Company" hidden></select>
          <button class="btn btn-sm btn-primary" id="ovRequest" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17z"/><path d="M14.5 6.5l3 3"/></svg><span id="ovRequestWord">Request change</span></button>
        </div>
      </div>
    </section>

    <nav class="rectabs cp-tabs" id="cpTabs" role="tablist" aria-label="Your account">
      <button class="tab is-on" data-pane="overview" type="button" role="tab" aria-selected="true" id="tabOverview">Overview</button>
      <button class="tab" data-pane="services" type="button" role="tab" aria-selected="false" id="tabServices">Services</button>
      <button class="tab" data-pane="letters" type="button" role="tab" aria-selected="false" id="tabLetters">Letters</button>
      <button class="tab" data-pane="reports" type="button" role="tab" aria-selected="false" id="tabReports" hidden>Reports</button>
      <button class="tab" data-pane="meetings" type="button" role="tab" aria-selected="false" id="tabMeetings" hidden>Meetings</button>
      <button class="tab" data-pane="account" type="button" role="tab" aria-selected="false" id="tabAccount">Account</button>
    </nav>

    <div class="cp-panes" data-swipe="cpTabs" data-narrow="640">

      <!-- Overview: what a client comes to check, each card opening its tab;
           who to reach and the company beside it. -->
      <div class="cp-pane cp-overview" data-pane="overview" role="tabpanel" aria-labelledby="tabOverview">
        <div class="cp-col">
          <section class="panel cp-card" id="ovSvc">
            <div class="cp-card-head"><h3 id="ovSvcHead">Services</h3><button class="btn btn-quiet btn-sm ovgo" type="button" data-go="services" id="ovSvcGo"><span class="ovgo-word">View all</span><svg class="ovgo-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button></div>
            <div id="ovSvcBox"></div>
          </section>
          <section class="panel cp-card" id="ovMeet" hidden>
            <div class="cp-card-head"><h3 id="ovMeetHead">Next meeting</h3><button class="btn btn-quiet btn-sm ovgo" type="button" data-go="meetings" id="ovMeetGo"><span class="ovgo-word">View all</span><svg class="ovgo-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button></div>
            <div id="ovMeetBox"></div>
          </section>
          <section class="panel cp-card" id="ovRep" hidden>
            <div class="cp-card-head"><h3 id="ovRepHead">Latest report</h3><button class="btn btn-quiet btn-sm ovgo" type="button" data-go="reports" id="ovRepGo"><span class="ovgo-word">View all</span><svg class="ovgo-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button></div>
            <div id="ovRepBox"></div>
            <div class="msg" id="ovRepMsg"></div>
          </section>
          <!-- The client's own pages: Content Review and each creator campaign. -->
          <section class="panel cp-card" id="engWrap" hidden>
            <div class="cp-card-head"><h3 id="engHead">Engagements</h3></div>
            <div id="engBox"></div>
          </section>
        </div>
        <aside class="cp-col" aria-label="Your account">
          <section class="panel cp-card" id="ovMgr" hidden>
            <div class="cp-card-head"><h3 id="ovMgrHead">Your account manager</h3></div>
            <div id="ovMgrBox"></div>
          </section>
          <section class="panel cp-card">
            <div class="cp-card-head"><h3 id="ovHead">Company</h3></div>
            <dl class="facts" id="ovFacts"></dl>
          </section>
        </aside>
      </div>

      <div class="cp-pane" data-pane="services" role="tabpanel" aria-labelledby="tabServices" hidden>
        <section class="panel cp-card">
          <div class="cp-card-head"><h3 id="svcHead">Services</h3></div>
          <div id="svcBox"></div>
        </section>
        <section class="panel cp-card" id="rqWrap" hidden>
          <div class="cp-card-head"><h3 id="rqHead">Requests</h3></div>
          <div class="undobar" id="rqUndo" hidden></div>
          <div class="msg" id="rqMsg"></div>
          <div id="rqBox"></div>
        </section>
      </div>

      <div class="cp-pane" data-pane="letters" role="tabpanel" aria-labelledby="tabLetters" hidden>
        <section class="panel cp-card">
          <div class="cp-card-head"><h3 id="docHead">Letters</h3></div>
          <div class="msg" id="docMsg"></div>
          <div id="docBox"></div>
        </section>
      </div>

      <!-- The monthly reports the team has confirmed and published. A draft
           never reaches this page: the database sends only the published
           version. The tab is drawn once there is one. -->
      <div class="cp-pane" data-pane="reports" role="tabpanel" aria-labelledby="tabReports" hidden>
        <section class="panel cp-card" id="repWrap">
          <div class="cp-card-head"><h3 id="repHead">Social media reports</h3></div>
          <div class="msg" id="repMsg"></div>
          <div id="repBox"></div>
        </section>
      </div>

      <!-- When we meet about each month's content. Never the month's tasks. -->
      <div class="cp-pane" data-pane="meetings" role="tabpanel" aria-labelledby="tabMeetings" hidden>
        <section class="panel cp-card" id="meetWrap">
          <div class="cp-card-head"><h3 id="meetHead">Meetings</h3></div>
          <div id="meetBox"></div>
        </section>
      </div>

      <div class="cp-pane" data-pane="account" role="tabpanel" aria-labelledby="tabAccount" hidden>
        <section class="panel cp-card">
          <div class="cp-card-head"><h3 id="ctHead">Contacts</h3></div>
          <div id="ovContacts"></div>
        </section>
        <section class="panel cp-card">
          <div class="cp-card-head"><h3 id="accHead">Portal access</h3></div>
          <div id="accBox"></div>
        </section>
        <section class="panel cp-card" id="payWrap" hidden>
          <div class="cp-card-head"><h3 id="payHead">Payment</h3></div>
          <dl class="facts" id="payFacts"></dl>
        </section>
      </div>

    </div>
  </div>
</main>

<div class="sheet" id="reqSheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="reqHeading">
    <div class="sheet-head">
      <h3 id="reqHeading"></h3>
    </div>
    <div class="row fgrid req-pick" id="reqPick" hidden>
      <div><label class="field-label" for="reqKind" id="reqKindLabel">Request</label>
        <select class="select" id="reqKind"></select></div>
      <div id="reqLineWrap" hidden><label class="field-label" for="reqLine" id="reqLineLabel">Service</label>
        <select class="select" id="reqLine"></select></div>
    </div>
    <dl class="facts" id="reqFacts"></dl>
    <label class="field-label" for="reqNote" id="reqNoteLabel">Note</label>
    <textarea class="input textarea" id="reqNote" rows="4"></textarea>
    <div class="row acts" style="margin-top:14px;margin-bottom:14px">
      <button class="btn btn-primary" id="reqGo" type="button">Send request</button>
      <button class="btn btn-quiet" id="reqCancel" type="button" style="flex:0 0 auto">Cancel</button>
    </div>
    <div class="msg" id="reqMsg"></div>
  </div>
</div>

<script src="/js/confirm.js?v=20261008p"></script>
<script src="/js/icons.js?v=20261008c"></script>
<script src="/js/portal.js?v=20261009a"></script>
</body>
</html>
