<!DOCTYPE html>
<html lang="en" data-face="client">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADspace Client Portal</title>
<meta name="description" content="Your company, services, letters and requests with ADspace.">
<meta property="og:site_name" content="ADspace">
<meta property="og:title" content="Client Portal by ADspace">
<meta property="og:description" content="Your company, services, letters and requests with ADspace.">
<meta property="og:image" content="https://mycdn.adspace.me/adspace-favicon.png">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/png" href="https://mycdn.adspace.me/adspace-favicon.png">
<link rel="apple-touch-icon" href="https://mycdn.adspace.me/adspace-favicon.png">
<!-- The one brand face, fetched alongside the stylesheet rather than after
     it: a heading that paints in the system face and flips a moment later
     is the page correcting itself in front of the reader. -->
<link rel="preload" as="font" type="font/woff2" href="/css/SlateRg.woff2" crossorigin>
<link rel="stylesheet" href="/css/portal.css?v=20260921h">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
<script src="/js/config.js?v=20260921h"></script>
<script src="/js/words.js?v=20260921h"></script>
<script src="/js/copy.js?v=20260921h"></script>
<script src="/js/state.js?v=20260921h"></script>
<script src="/js/menu.js?v=20260921h"></script>
<script src="/js/api.js?v=20260921h"></script>
<script src="/js/money.js?v=20260921h"></script>
<script src="/js/documents.js?v=20260921h"></script>
</head>
<body>

<script src="/js/chrome.js?v=20260921h" data-kicker="Client Portal" data-actions="lang"></script>

<template id="chromeExtra">
  <button class="pill" id="portalOut" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M12 4h6a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6"/></svg><span id="portalOutWord">Sign out</span></button>
</template>

<main class="shell">

  <section class="cover" id="stateBox" hidden>
    <div class="cover-inner">
      <div class="cover-panel">
        <h2 id="stateTitle"></h2>
        <p id="stateText"></p>
        <form id="signForm" hidden onsubmit="return false">
          <input class="input" id="signEmail" type="email" placeholder="name@company.com" autocomplete="email" aria-label="Email">
          <button class="btn btn-primary" id="signGo" type="button">Send link</button>
        </form>
        <div class="msg" id="stateMsg"></div>
      </div>
    </div>
  </section>

  <div id="app" hidden>

    <!-- Who they are and who to reach stay beside the work on a screen wide
         enough to hold both: seven sections in one column meant the account
         manager's name was a scroll away from the letter that names them.
         Below the workspace width it is one column again, in the same order,
         because a rail on a phone is a second column of nothing. -->
    <!-- The page opens on who it is for. It used to start straight in on
         Services: a client signed in and the first thing they read was a table
         of their own line items, with their company name nowhere on the page
         and the one action they have buried at the top of the second column.
         The same identity area both console records open on. -->
    <!-- The console record's own head, cell for cell: the mark, then who this
         is (the name with the meta under it), then the one control area on the
         right. It was `.crm-title` with the meta as a sibling, so the meta
         landed in the grid's third column — the registered name and the
         account manager printed to the right of a filled button instead of
         under the name they belong to, on every width. -->
    <section class="panel rec-head" id="cpHead">
      <div class="rec-id">
        <span class="rec-mark" id="cpMark" aria-hidden="true"></span>
        <div class="rec-who">
          <div class="rec-name"><h2 id="cpName"></h2></div>
          <p class="rec-id-meta" id="cpMeta"></p>
        </div>
        <div class="rec-ctl">
          <span class="tone" id="cpState" hidden></span>
          <select class="select select-sm" id="clientPick" aria-label="Company" hidden></select>
          <button class="btn btn-sm btn-primary" id="ovRequest" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17z"/><path d="M14.5 6.5l3 3"/></svg><span id="ovRequestWord">Request change</span></button>
        </div>
      </div>
    </section>

    <div class="rec cportal">
      <!-- One block per question, the way both console records carry theirs. -->
      <aside class="rec-rail" aria-label="Your account">
        <div class="railblock">
          <h3 class="railtitle" id="ovHead">Overview</h3>
          <dl class="facts" id="ovFacts"></dl>
        </div>
        <div class="railblock is-last">
          <h3 class="railtitle" id="ctHead">Contacts</h3>
          <div id="ovContacts"></div>
        </div>
      </aside>
      <div class="rec-pane" data-pane="all">

    <div class="viewhead"><span class="headmark"><h3 id="svcHead">Services</h3></span></div>
    <div id="svcBox"></div>

    <div id="rqWrap" hidden>
      <div class="viewhead"><span class="headmark"><h3 id="rqHead">Requests</h3></span></div>
      <div class="undobar" id="rqUndo" hidden></div>
      <div class="msg" id="rqMsg"></div>
      <div id="rqBox"></div>
    </div>

    <div class="viewhead"><span class="headmark"><h3 id="docHead">Letters</h3></span></div>
    <div class="msg" id="docMsg"></div>
    <div id="docBox"></div>

    <div id="engWrap" hidden>
      <div class="viewhead"><span class="headmark"><h3 id="engHead">Engagements</h3></span></div>
      <div id="engBox"></div>
    </div>

    <div id="payWrap" hidden>
      <div class="viewhead"><span class="headmark"><h3 id="payHead">Payment</h3></span></div>
      <section class="panel">
        <dl class="facts" id="payFacts"></dl>
      </section>
    </div>

    <div class="viewhead"><span class="headmark"><h3 id="accHead">Portal access</h3></span></div>
    <div id="accBox"></div>

      </div>
    </div>
  </div>
</main>

<div class="sheet" id="reqSheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="reqHeading">
    <div class="sheet-head">
      <h3 id="reqHeading"></h3>
    </div>
    <dl class="facts" id="reqFacts"></dl>
    <label class="field-label" for="reqNote" id="reqNoteLabel">Note</label>
    <textarea class="input textarea" id="reqNote" rows="4"></textarea>
    <div class="row" style="margin-top:14px;margin-bottom:14px">
      <button class="btn btn-primary" id="reqGo" type="button">Send request</button>
      <button class="btn btn-quiet" id="reqCancel" type="button" style="flex:0 0 auto">Cancel</button>
    </div>
    <div class="msg" id="reqMsg"></div>
  </div>
</div>

<script src="/js/portal.js?v=20260921h"></script>
</body>
</html>
