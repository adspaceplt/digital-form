<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- White to the edge of the browser's own bar: the page, Safari's header
     and Chrome's tab strip on a phone are one surface. -->
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<!-- The front door of an internal tool. Nothing here is for a search engine. -->
<meta name="robots" content="noindex, nofollow">
<title>Digital Portal</title>
<meta name="description" content="ADspace Digital Portal">
<link rel="icon" type="image/png" href="https://mycdn.adspace.me/adspace-favicon.png">
<link rel="apple-touch-icon" href="https://mycdn.adspace.me/adspace-favicon.png">
<!-- The one brand face, fetched alongside the stylesheet rather than after it. -->
<link rel="preload" as="font" type="font/woff2" href="/css/SlateRg.woff2" crossorigin>
<link rel="stylesheet" href="/css/portal.css?v=20260926m">
<style>
  /* A cover and nothing else: the mark at the top, the name in the middle.
     There is no sign in here and no list of the rooms inside, because every
     door into this portal is a link somebody was sent — the console behind
     Supabase Auth, the three client pages behind their own tokens. A menu of
     them on a public page would be an index of what exists and a set of
     dead ends for anybody without a link.

     Built from css/portal.css so this page and the portal it fronts share one
     set of tokens: the same ground, the same ink, the same display face. It
     needs no script, so it still reads with JavaScript off. */
  html, body { height: 100%; }
  /* White, not the portal's off-white ground: a cover with nothing on it but
     the mark and a name has no cards to lift off a ground, so the ground is
     the page (the user, 2026-09-24). */
  body {
    margin: 0; display: flex; flex-direction: column;
    background: var(--card); color: var(--ink);
  }
  .doorbar {
    height: var(--head-h); flex: 0 0 auto;
    display: flex; align-items: center;
    padding: 0 24px;
  }
  /* `contain` for the reason `.brand-logo` takes it: height plus an auto
     width plus a max-width clamp squashes the mark in a box too narrow for
     it, and a squashed wordmark is not the wordmark. */
  .doorbar img { height: 26px; width: auto; display: block;
    object-fit: contain; object-position: left center; }
  .door {
    flex: 1 1 auto; display: flex; align-items: center; justify-content: center;
    /* The bar has already taken its height off the top, so the title sits on
       the optical centre of what is left rather than below it. */
    padding: 0 24px calc(var(--head-h) / 2);
  }
  /* A name, not a headline: the room is named at the size a label is read
     at, in the ink the portal's secondary text takes, so the mark leads and
     the page reads as quiet rather than announced (the user, 2026-09-24:
     "smaller words, to be more minimalist and modern"). It was the display
     face at 22 to 30px. */
  .door h1 {
    margin: 0; font-weight: 500; font-size: 15px; letter-spacing: -.005em;
    line-height: 1.4; text-align: center; color: var(--ink-soft);
  }
  @media (max-width: 640px) { .doorbar { padding: 0 16px; } }
</style>
</head>
<body>

<header class="doorbar">
  <img src="https://mycdn.adspace.me/adspace-brandname.png" alt="ADspace"
       onerror="this.replaceWith(Object.assign(document.createElement('b'),{textContent:'ADspace'}))">
</header>

<main class="door">
  <h1>Digital Portal</h1>
</main>

</body>
</html>
