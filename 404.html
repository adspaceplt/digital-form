<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- White to the edge of the browser's own bar, as the front door is. -->
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<!-- Nothing on this host is for a search engine, and a 404 least of all. -->
<meta name="robots" content="noindex, nofollow">
<title>Page not found</title>
<meta name="description" content="ADspace Digital Portal">
<link rel="icon" type="image/png" href="https://mycdn.adspace.me/adspace-favicon.png">
<link rel="apple-touch-icon" href="https://mycdn.adspace.me/adspace-favicon.png">
<!-- The one brand face, fetched alongside the stylesheet rather than after it. -->
<link rel="preload" as="font" type="font/woff2" href="/css/SlateRg.woff2" crossorigin>
<link rel="stylesheet" href="/css/portal.css?v=20260925h">
<style>
  /* The host's own 404, drawn from css/portal.css so a wrong address reads as
     this portal rather than as a page from somewhere else. It is the cover
     component the client pages use for "Link not recognised": the title says
     what happened, the line says what to do about it, and the line never
     restates the title.

     English only (the user, 2026-09-24): a wrong address on this host is
     almost always the team's own, and the client covers inside the portal keep
     both languages. It is the same composition as index.html — the mark on a
     bar of the portal's own height, the panel on the optical centre of what is
     left, a white ground to the browser's edge — so the two root pages of this
     host agree with each other.

     What went with the old page: a `noscript` redirect to adspacestudios.com,
     which was there because that page could not draw itself without script.
     This one needs none, so the redirect would only have thrown a reader off a
     page they could already read; a client following a portal link belongs
     here, not on the marketing site. Also `/css/main.css` and `/fonts/Custom.TTF`,
     neither of which exists on this host. */
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column;
    background: var(--card); color: var(--ink);
  }
  .doorbar {
    height: var(--head-h); flex: 0 0 auto;
    display: flex; align-items: center;
    padding: 0 24px;
  }
  /* `contain` for the reason `.brand-logo` takes it: height plus an auto
     width plus a max-width clamp squashes the mark in a box too narrow for
     it, and a squashed wordmark is not the wordmark. */
  .doorbar img { height: 26px; width: auto; display: block;
    object-fit: contain; object-position: left center; }
  .door {
    flex: 1 1 auto; display: flex; align-items: center; justify-content: center;
    /* The bar has taken its height off the top, so half of it comes off the
       bottom and the panel sits on the optical centre of what is left. */
    padding: 24px 24px calc(24px + var(--head-h) / 2);
  }
  /* Small and quiet, as the front door is: the title at the panel title
     size, the line at the console's body size, the two actions small. */
  .door-panel { max-width: 400px; width: 100%; text-align: center; }
  .door-panel h1 {
    margin: 0 0 6px; font-weight: 600;
    font-size: 17px; letter-spacing: -.01em; line-height: 1.3;
  }
  .door-panel p { margin: 0; color: var(--ink-soft); font-size: 14px; line-height: 1.6; }
  /* The way out, and the way to ask. Equal halves on a phone, as every other
     pair of actions in this portal is. */
  .door-acts { margin-top: 20px; display: flex; gap: 8px; justify-content: center; }
  /* `.btn` carries `flex: 1` for the rows it usually sits in, which here made
     Contact support a 316px slab beside a 116px one. At a desk each takes its
     own width off the 116px floor; on a phone they are equal halves. */
  .door-acts > .btn { flex: 0 0 auto; }
  @media (max-width: 640px) {
    .doorbar { padding: 0 16px; }
    .door { padding: 20px 16px calc(20px + var(--head-h) / 2); }
    .door-acts > .btn { flex: 1 1 0; min-width: 0; }
  }
</style>
</head>
<body lang="en">

<header class="doorbar">
  <img src="https://mycdn.adspace.me/adspace-brandname.png" alt="ADspace"
       onerror="this.replaceWith(Object.assign(document.createElement('b'),{textContent:'ADspace'}))">
</header>

<main class="door">
  <div class="door-panel">
    <h1>Page not found</h1>
    <p>Please check the link or contact your ADspace account manager.</p>
    <div class="door-acts">
      <a class="btn btn-sm btn-primary" href="https://adspacestudios.com" rel="nofollow">Visit website</a>
      <a class="btn btn-sm" href="mailto:advertise@adspacestudios.com?subject=Digital%20Portal%20assistance">Contact support</a>
    </div>
  </div>
</main>

</body>
</html>
