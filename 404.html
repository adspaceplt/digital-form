<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- White to the edge of the browser's own bar, as the front door is. -->
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<!-- Nothing on this host is for a search engine, and a 404 least of all. -->
<meta name="robots" content="noindex, nofollow">
<title>Page not found</title>
<meta name="description" content="ADspace Digital Portal">
<link rel="icon" type="image/png" sizes="192x192" href="/img/favicon-192.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<!-- The one brand face, fetched alongside the stylesheet rather than after it. -->
<link rel="preload" as="font" type="font/woff2" href="/css/SlateRg.woff2" crossorigin>
<link rel="stylesheet" href="/css/portal.css?v=20261124zzfb">
<style>
  /* The host's own 404, drawn from css/portal.css so a wrong address reads as
     this portal rather than as a page from somewhere else. It is the cover
     component the client pages use for "Link not recognised": the title says
     what happened, the line says what to do about it, and the line never
     restates the title.

     English only (the user, 2026-09-24): a wrong address on this host is
     almost always the team's own, and the client covers inside the portal keep
     both languages. It is the same composition as index.html — the mark on a
     bar of the portal's own height, the panel on the optical centre of what is
     left, a white ground to the browser's edge — so the two root pages of this
     host agree with each other.

     What went with the old page: a `noscript` redirect to adspacestudios.com,
     which was there because that page could not draw itself without script.
     This one needs none, so the redirect would only have thrown a reader off a
     page they could already read; a client following a portal link belongs
     here, not on the marketing site. Also `/css/main.css` and `/fonts/Custom.TTF`,
     neither of which exists on this host. */
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column;
    background: var(--card); color: var(--ink);
  }
  .doorbar {
    height: var(--head-h); flex: 0 0 auto;
    display: flex; align-items: center;
    padding: 0 24px;
    /* The rule every chrome page's bar draws (2026-10-20, NF-1). */
    border-bottom: 1px solid var(--line);
  }
  /* `contain` for the reason `.brand-logo` takes it: height plus an auto
     width plus a max-width clamp squashes the mark in a box too narrow for
     it, and a squashed wordmark is not the wordmark. */
  .doorbar img { height: 26px; width: auto; display: block;
    object-fit: contain; object-position: left center; }
  /* The notice is every page's cover (the cover family, 2026-11-22):
     css/portal.css lays it, under this page's own bar and over its foot. */
  @media (max-width: 640px) { .doorbar { padding: 0 16px; } }
</style>
</head>
<body lang="en">

<header class="doorbar">
  <img src="https://mycdn.adspace.me/adspace-brandname.png" alt="ADspace"
       onerror="this.replaceWith(Object.assign(document.createElement('b'),{textContent:'ADspace'}))">
</header>

<main class="shell">
  <section class="cover">
    <div class="cover-inner">
      <div class="cover-panel" data-glyph="docq">
        <h1>Page not found</h1>
        <p>Please check the address, or contact ADspace.</p>
        <div class="cover-acts">
          <a class="btn" href="https://adspacestudios.com" target="_blank" rel="nofollow noopener">Visit website<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a>
          <a class="btn" href="mailto:advertise@adspacestudios.com?subject=Digital%20Portal%20assistance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>Contact support</a>
        </div>
      </div>
    </div>
  </section>
</main>

<!-- The portal's foot, as js/chrome.js draws it on every other page; written
     here because this page runs no script of its own (UX audit NOTFOUND-1,
     2026-10-14). The year is the one value filled in. -->
<footer class="portalfoot"><div class="portalfoot-in">
  <span class="portalfoot-copy">&copy; <span id="footYear">2026</span> ADSPACE PLT. All Rights Reserved.</span>
  <a class="portalfoot-link" href="https://adspacestudios.com/legal/policies" target="_blank" rel="noopener">Terms of Service</a>
</div></footer>
<script>document.getElementById('footYear').textContent = new Date().getFullYear();</script>
<!-- Page availability covers this page too, as a system page (EVERY PAGE
     AVAILABLE, 2026-11-21); it answers any address, so it names itself. -->
<script src="/js/config.js?v=20261124zzfb"></script>
<script src="/js/words.js?v=20261124ts"></script>
<script src="/js/clock.js?v=20261120wd"></script>
<script src="/js/maintenance.js?v=20261124zzfb" data-page="notfound"></script>

</body>
</html>
