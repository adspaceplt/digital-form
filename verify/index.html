<body class="is-plain">

<script src="/js/chrome.js?v=20260926j" data-kicker="Verify" data-actions="lang"></script>

<main class="shell">
  <!-- One field, one button, one answer. The page answers an exact reference
       with the kind, the date and whether it stands, and never the recipient:
       what it gives away is what the footer of the document already printed. -->
  <section class="cover">
    <div class="cover-inner">
      <div class="cover-panel">
        <h2 id="vTitle">Verify document</h2>
        <p id="vText">Enter the reference printed on the document.</p>
        <form id="vForm" novalidate>
          <input class="input" id="vSerial" placeholder="AD/AC180/SC" aria-label="Reference" autocomplete="off" autocapitalize="characters" spellcheck="false">
          <button class="btn btn-primary" id="vGo" type="submit">Verify</button>
        </form>
        <div class="verify-out" id="vOut" hidden></div>
      </div>
    </div>
  </section>
</main>

<script src="/js/verify.js?v=20260926j"></script>
</body>
</html>
