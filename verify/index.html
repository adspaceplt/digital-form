<!DOCTYPE html>
<html lang="en" data-face="client" data-layout="v3">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Verify document · %agency.trading_name%</title>
<meta name="description" content="Check a reference printed on a document issued by %agency.trading_name%.">
<meta property="og:title" content="Verify document by %agency.trading_name%">
<meta property="og:description" content="Check a reference printed on a document issued by %agency.trading_name%.">
<link rel="preload" as="font" type="font/woff2" href="/css/SlateRg.woff2" crossorigin>
<link rel="stylesheet" href="/css/portal.css?v=dev">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<!-- The demo (js/demo.js): sample data in place of the database while `adspace-demo` stands;
     this page answers the sample agency's documents alone, any reference typed. -->
<script>try{var dm=JSON.parse(localStorage.getItem('adspace-demo')||'null');var dk=/^\/(client|verify)\//.test(location.pathname)||/[?&]k=demo0/i.test(location.search)||(/^\/creator\//.test(location.pathname)&&!/[?&]k=/.test(location.search)&&/^DEMO0/.test(localStorage.getItem('adspace-creator')||''));if(dm&&dm.until>Date.now()&&dk){window.ADSPACE_DEMO=dm;document.write('<script src="/demo/seed.js?v=dev"><\/script><script src="/demo/engine.js?v=dev"><\/script>');}}catch(e){}</script>
<script src="/js/config.js?v=dev"></script>
<!-- js/demo.js only while the demo stands: the public page carries nothing for it. -->
<script>if(window.ADSPACE_DEMO)document.write('<script src="/js/demo.js?v=dev"><\/script>');</script>
<script src="/js/icons.js?v=dev"></script>
<script src="/js/words.js?v=dev"></script>
<script src="/js/clock.js?v=dev"></script>
<script src="/js/api.js?v=dev"></script>
<script src="/js/maintenance.js?v=dev"></script>
</head>
<body class="is-plain">

<script src="/js/chrome.js?v=dev" data-kicker="Verify" data-actions="lang"></script>

<main class="shell">
  <!-- One field, one button, one answer. The page answers an exact reference
       with the kind, the date and whether it stands, and never the recipient:
       what it gives away is what the footer of the document already printed. -->
  <section class="cover">
    <div class="cover-inner">
      <div class="cover-panel verify-panel" data-glyph="shield">
        <h2 id="vTitle">Verify document</h2>
        <p id="vText">Enter the reference or the Document ID printed on the document.</p>
        <form id="vForm" novalidate>
          <input class="input" id="vSerial" placeholder="AQL/AC001/260901" aria-label="Reference" autocomplete="off" autocapitalize="characters" spellcheck="false">
          <button class="btn btn-primary" id="vGo" type="submit">Verify</button>
        </form>
        <!-- The answer is said as it arrives: the live region stands from the
             first paint, so a screen reader hears what is put into it. -->
        <div role="status" aria-live="polite"><div class="verify-out" id="vOut" hidden></div></div>
      </div>
    </div>
  </section>
</main>

<script src="/js/seal.js?v=dev"></script>
<script src="/js/verify.js?v=dev"></script>
</body>
</html>
