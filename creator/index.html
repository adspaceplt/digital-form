<!DOCTYPE html>
<html lang="en" data-face="client">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADspace Creator Portal</title>
<meta name="description" content="Your bookings with ADspace.">
<meta property="og:site_name" content="ADspace">
<meta property="og:title" content="Creator Portal by ADspace">
<meta property="og:description" content="Your bookings, your dates and where to hand in your work.">
<meta property="og:image" content="https://mycdn.adspace.me/adspace-favicon.png">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/png" href="https://mycdn.adspace.me/adspace-favicon.png">
<link rel="apple-touch-icon" href="https://mycdn.adspace.me/adspace-favicon.png">
<link rel="preload" as="font" type="font/woff2" href="/css/SlateRg.woff2" crossorigin>
<link rel="stylesheet" href="/css/portal.css?v=20260925l">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/js/config.js?v=20260925l"></script>
<script src="/js/words.js?v=20260925l"></script>
<script src="/js/copy.js?v=20260925l"></script>
<script src="/js/state.js?v=20260925l"></script>
<script src="/js/api.js?v=20260925l"></script>
<script src="/js/sheet.js?v=20260925l"></script>
</head>
<body>

<script src="/js/chrome.js?v=20260925l" data-kicker="Creator Portal" data-for data-actions="lang"></script>

<main class="shell">

  <!-- Every full page state this portal has: the code asked for, a code that
       is not ours, a creator stood down, and a page that could not load. -->
  <section class="cover" id="stateBox" hidden>
    <div class="cover-inner">
      <div class="cover-panel">
        <h2 id="stateTitle"></h2>
        <p id="stateText"></p>
        <form id="codeRow" hidden onsubmit="return false">
          <input class="input" id="codeInput" type="text" inputmode="latin"
                 autocapitalize="characters" autocomplete="off" spellcheck="false"
                 maxlength="9" placeholder="7K2M-9PQR" aria-label="Access code">
          <button class="btn btn-primary" id="codeGo" type="button">Open</button>
        </form>
        <div class="msg" id="stateMsg"></div>
      </div>
    </div>
  </section>

  <div id="app" hidden>
    <!-- Who they are to us, in the console record's own head: the name, since
         when, how many bookings, and the profile links a client opens on the
         selection page, which the creator keeps up to date here. No mark: a
         creator has no artwork on file, and a disc of initials is a
         placeholder for a picture this portal does not hold. No fee, ever:
         the rate on a booking is the client's price. -->
    <section class="panel rec-head crhead" id="crHead">
      <div class="rec-id rec-id-solo">
        <div class="rec-who">
          <div class="rec-name"><h1 id="whoName"></h1></div>
          <p class="rec-id-meta" id="whoLine"></p>
        </div>
        <div class="rec-ctl">
          <button class="btn btn-sm" id="linksEdit" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17z"/><path d="M14.5 6.5l3 3"/></svg><span id="linksEditWord">Edit links</span></button>
        </div>
      </div>
      <div class="crlinks" id="crLinks"></div>
      <div class="msg" id="crLinksMsg"></div>
    </section>

    <!-- The creator's own profile links, one field a platform. The database
         reads each one (`profile_of`) and keeps only a real profile on that
         platform, so this sheet asks for a link and says which one it could
         not read. -->
    <div class="sheet" id="linksSheet" hidden>
      <div class="sheet-card formsheet" role="dialog" aria-modal="true" aria-labelledby="linksTitle" tabindex="-1">
        <div class="sheet-head">
          <h3 id="linksTitle">Profile links</h3>
          <button class="iconbtn" id="linksClose" type="button" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
        <div class="sheet-body">
          <section class="fsec" id="linksFields"></section>
          <div class="msg" id="linksMsg"></div>
        </div>
        <div class="sheet-foot">
          <button class="btn btn-primary" id="linksSave" type="button">Save</button>
          <button class="btn btn-quiet" id="linksCancel" type="button">Cancel</button>
        </div>
      </div>
    </div>

    <h2 class="sectionhead" id="workHead" hidden></h2>
    <!-- A creator with four bookings had four full cards stacked down the
         page, each with its own upload box, and the one that needed them
         today was wherever it happened to fall. The queue is what they have;
         the card below it is the one they are working on. -->
    <div class="cwork">
      <nav class="queue" id="workQueue" hidden aria-label="Your bookings"></nav>
      <div id="workList"></div>
    </div>

    <section class="cover-panel" id="noWork" hidden>
      <h2 id="noWorkTitle"></h2>
      <p id="noWorkText"></p>
    </section>

  </div>

</main>

<script src="/js/creator.js?v=20260925l"></script>
</body>
</html>
