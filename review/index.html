<!DOCTYPE html>
<html lang="en" data-face="client" data-layout="v3">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>ADspace Content Review</title>

<!-- What a link unfurls to in WhatsApp, Slack or a message.

     The client's name belongs at the front of this, and the page puts it there
     the moment the feed arrives. A crawler cannot see that: it fetches the file
     and runs no scripts, and every client is served the same file. So what is
     written here is the half that is true of all of them, and the name is added
     at runtime for anything that does execute the page. -->
<meta name="description" content="Content prepared by ADspace, ready for your review.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ADspace">
<meta property="og:title" content="Content Review Portal by ADspace">
<meta property="og:description" content="This month's posts, shown the way they will appear on each platform. Approve each post, or request changes.">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Content Review Portal by ADspace">
<meta name="twitter:description" content="This month's posts, shown the way they will appear on each platform. Approve each post, or request changes.">
<!-- The ADspace mark, so a pinned tab reads as ADspace. Served from our own
     CDN rather than the website builder's, so a site rebuild cannot break it. -->
<link rel="icon" type="image/png" sizes="192x192" href="/img/favicon-192.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<!-- The one brand face, fetched alongside the stylesheet rather than after
     it: a heading that paints in the system face and flips a moment later
     is the page correcting itself in front of the reader. -->
<link rel="preload" as="font" type="font/woff2" href="/css/SlateRg.woff2" crossorigin>
<link rel="stylesheet" href="/css/portal.css?v=20261127pt3">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<!-- The demo (js/demo.js): sample data in place of the database while `adspace-demo` stands,
     for the demo's own links alone (a key holding 0, which no real key does). -->
<script>try{var dm=JSON.parse(localStorage.getItem('adspace-demo')||'null');var dk=/^\/(client|verify)\//.test(location.pathname)||/[?&]k=demo0/i.test(location.search)||(/^\/creator\//.test(location.pathname)&&!/[?&]k=/.test(location.search)&&/^DEMO0/.test(localStorage.getItem('adspace-creator')||''));if(dm&&dm.until>Date.now()&&dk){window.ADSPACE_DEMO=dm;document.write('<script src="/demo/seed.js?v=20261126rvt"><\/script><script src="/demo/engine.js?v=20261127zn"><\/script>');}}catch(e){}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" integrity="sha384-3zSEDfvllQohrq0PHL1fOXJuC/jSOO34H46t6UQfobFOmxE5BpjjaIJY5F2/bMnU" crossorigin="anonymous"></script>
<script src="/js/config.js?v=20261126ge"></script>
<script src="/js/icons.js?v=20261127zg"></script>
<!-- js/demo.js only while a demo is kept in this browser (its sample data, or an expired one to let go). -->
<script>try{if(window.ADSPACE_DEMO||localStorage.getItem('adspace-demo'))document.write('<script src="/js/demo.js?v=20261121qse"><\/script>');}catch(e){}</script>
<script src="/js/words.js?v=20261127pt"></script>
<script src="/js/clock.js?v=20261125ct"></script>
<script src="/js/copy.js?v=20261127zn"></script>
<script src="/js/grow.js?v=20261117zzzf"></script>
<script src="/js/decide.js?v=20261117zzzf"></script>
<script src="/js/state.js?v=20261117zzzf"></script>
<script src="/js/form.js?v=20261126gl"></script>
<script src="/js/menu.js?v=20261127"></script>
<script src="/js/guide.js?v=20261117zzzf"></script>
<script src="/js/api.js?v=20261126rfd"></script>
<script src="/js/maintenance.js?v=20261127zg"></script>
<script src="/js/announce.js?v=20261127fc"></script>
<script src="/js/media.js?v=20261117zzzf"></script>
<script src="/js/mockups.js?v=20261117zzzf"></script>
</head>
<body>

<div id="demoStrip" class="demo-strip" hidden>
  <b>Demo mode.</b> Sample content only.
</div>

<!-- Header and footer come from the shared chrome. -->
<script src="/js/chrome.js?v=20261127py" data-kicker="Content Review" data-for data-actions="qr"></script>

<main class="shell shell-review">
  <div class="pageload" role="status" aria-label="Loading"><span class="pageload-spin" aria-hidden="true"></span></div>
  <!-- Who the page is for and what waits on the reader, in one line; the
       stage strip under it is the one place the counts are said (2026-11-26). -->
  <section class="panel rec-head" id="rvHead" data-shown hidden>
    <div class="rec-id">
      <span class="rec-mark" id="rvMark" aria-hidden="true"></span>
      <div class="rec-who">
        <div class="rec-name"><h2 id="rvName"></h2></div>
        <p class="rec-id-meta" id="rvMeta"></p>
      </div>
    </div>
  </section>
  <nav class="tabrow stagestrip" id="stageStrip" role="tablist" aria-label="Review stage" hidden></nav>
  <!-- The month and its size, with Filter at its right where there is
       something to narrow (more than one format or set). -->
  <div class="setline" id="filterbar" hidden>
    <span class="setline-what" id="setLine"></span>
    <button class="btn btn-sm btn-quiet setline-filter" id="filterBtn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="filterPop" hidden>
      <svg aria-hidden="true" data-ic="sliders"></svg><span id="filterWord">Filter</span>
    </button>
  </div>
  <div class="kmenu filterpop" id="filterPop" role="dialog" aria-labelledby="filterPopName" hidden>
    <div class="popcard-head">
      <span class="filterpop-name" id="filterPopName">Filter</span>
      <button class="iconbtn popcard-x" id="filterHide" type="button" aria-label="Close"><svg aria-hidden="true" data-ic="x"></svg></button>
    </div>
    <select class="select" id="formatFilter" aria-label="Filter by format">
      <option value="all">All formats</option>
    </select>
    <select class="select" id="batchFilter" aria-label="Filter by content set">
      <option value="all">All sets</option>
    </select>
    <div class="safetoggle" id="safeWrap" hidden>
      <span class="safetoggle-name" id="safeName">Show safe area</span>
      <button class="switch" type="button" role="switch" id="safeToggle" aria-checked="false" aria-labelledby="safeName"></button>
    </div>
  </div>

  <div id="content"></div>
  <p class="stage-empty" id="stageEmpty" hidden>No posts.</p>

  <section class="cover" id="cover" data-shown hidden>
    <div class="cover-inner">
      <div class="cover-panel">
        <h2 id="coverTitle">Content Review</h2>
        <p id="coverBody"></p>
        <form id="passForm" hidden>
          <input class="input" id="passInput" type="password" placeholder="Access code" autocomplete="off" aria-label="Access code">
          <button class="btn btn-primary" type="submit">Open</button>
        </form>
      </div>
    </div>
  </section>
</main>

<!-- The Review Canvas. The gallery is how a client sees the month; this is
     how they decide on one post, with the mockup at the size it deserves and
     everything the decision rests on beside it. The blocks are moved out of
     the card and put back on close, so there is one approve control in the
     page and it cannot drift from the one in the gallery. -->
<div class="canvas" id="canvas" hidden>
  <!-- A sideways swipe on a phone presses Previous or Next (js/swipe.js). -->
  <div class="canvas-card" role="dialog" aria-modal="true" aria-labelledby="canvasTitle"
       data-swipe-prev="canvasPrev" data-swipe-next="canvasNext" data-swipe-media>
    <header class="canvas-head">
      <span class="canvas-what">
        <span class="canvas-title" id="canvasTitle"></span>
        <span class="canvas-dims" id="canvasDims"></span>
      </span>
      <span class="canvas-nav">
        <button class="iconbtn" id="canvasPrev" type="button" aria-label="Previous post">
          <svg aria-hidden="true" data-ic="chevleft"></svg>
        </button>
        <span class="canvas-pos" id="canvasPos"></span>
        <button class="iconbtn" id="canvasNext" type="button" aria-label="Next post">
          <svg aria-hidden="true" data-ic="chevron"></svg>
        </button>
      </span>
      <button class="iconbtn canvas-close" id="canvasClose" type="button" aria-label="Close">
        <svg aria-hidden="true" data-ic="x"></svg>
      </button>
    </header>
    <div class="canvas-body">
      <div class="canvas-stage" id="canvasStage"></div>
      <aside class="canvas-rail" id="canvasRail" aria-label="This post"></aside>
    </div>
  </div>
</div>

<div class="qr-modal" id="qrModal">
  <div class="qr-card">
    <h3>Review on mobile</h3>
    <p>Scan to open this page on a mobile device.</p>
    <div id="qrTarget"></div>
    <button class="btn" id="qrClose" type="button">Close</button>
  </div>
</div>

<script src="/js/swipe.js?v=20261117zzzf"></script>
<script src="/js/review.js?v=20261127rv"></script>
</body>
</html>
