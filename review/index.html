<!DOCTYPE html>
<html lang="en" data-face="client">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADspace Content Review</title>

<!-- What a link unfurls to in WhatsApp, Slack or a message.

     The client's name belongs at the front of this, and the page puts it there
     the moment the feed arrives. A crawler cannot see that: it fetches the file
     and runs no scripts, and every client is served the same file. So what is
     written here is the half that is true of all of them, and the name is added
     at runtime for anything that does execute the page. -->
<meta name="description" content="Content prepared by ADspace, ready for your review.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ADspace">
<meta property="og:title" content="Content Review Portal by ADspace">
<meta property="og:description" content="This month's posts, shown the way they will appear on each platform. Approve, or tell us what to change.">
<meta property="og:image" content="https://mycdn.adspace.me/adspace-favicon.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Content Review Portal by ADspace">
<meta name="twitter:description" content="This month's posts, shown the way they will appear on each platform. Approve, or tell us what to change.">
<meta name="twitter:image" content="https://mycdn.adspace.me/adspace-favicon.png">
<!-- The ADspace mark, so a pinned tab reads as ADspace. Served from our own
     CDN rather than the website builder's, so a site rebuild cannot break it. -->
<link rel="icon" type="image/png" href="https://mycdn.adspace.me/adspace-favicon.png">
<link rel="apple-touch-icon" href="https://mycdn.adspace.me/adspace-favicon.png">
<!-- The one brand face, fetched alongside the stylesheet rather than after
     it: a heading that paints in the system face and flips a moment later
     is the page correcting itself in front of the reader. -->
<link rel="preload" as="font" type="font/woff2" href="/css/SlateRg.woff2" crossorigin>
<link rel="stylesheet" href="/css/portal.css?v=20260920c">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/js/config.js?v=20260920c"></script>
<script src="/js/words.js?v=20260920c"></script>
<script src="/js/copy.js?v=20260920c"></script>
<script src="/js/state.js?v=20260920c"></script>
<script src="/js/api.js?v=20260920c"></script>
<script src="/js/mockups.js?v=20260920c"></script>
</head>
<body>

<div id="demoStrip" class="demo-strip" hidden>
  <b>Demo mode.</b> Sample content; no database connected.
</div>

<!-- Header and footer come from the shared chrome. -->
<script src="/js/chrome.js?v=20260920c" data-kicker="Content Review" data-for data-actions="qr"></script>

<main class="shell">
  <div class="filterbar" id="filterbar" hidden>
    <select class="select" id="formatFilter" aria-label="Filter by format">
      <option value="all">All formats</option>
    </select>
    <select class="select" id="batchFilter" aria-label="Filter by content set">
      <option value="all">All sets</option>
    </select>
    <label class="safetoggle" id="safeWrap" hidden>
      <input type="checkbox" id="safeToggle">
      <span>Show safe zones</span>
    </label>
    <span class="count" id="countLabel"></span>
  </div>

  <div id="content"></div>

  <section class="cover" id="cover" hidden>
    <div class="cover-inner">
      <div class="cover-panel">
        <h2 id="coverTitle">Content Review</h2>
        <p id="coverBody"></p>
        <form id="passForm" hidden>
          <input class="input" id="passInput" type="password" placeholder="Access code" autocomplete="off">
          <button class="btn btn-primary" type="submit">Open</button>
        </form>
      </div>
    </div>
  </section>
</main>

<!-- The Review Canvas. The gallery is how a client sees the month; this is
     how they decide on one post, with the mockup at the size it deserves and
     everything the decision rests on beside it. The blocks are moved out of
     the card and put back on close, so there is one approve control in the
     page and it cannot drift from the one in the gallery. -->
<div class="canvas" id="canvas" hidden>
  <div class="canvas-card" role="dialog" aria-modal="true" aria-labelledby="canvasTitle">
    <header class="canvas-head">
      <span class="canvas-title" id="canvasTitle"></span>
      <span class="canvas-dims" id="canvasDims"></span>
      <span class="canvas-pos" id="canvasPos"></span>
      <button class="iconbtn" id="canvasPrev" type="button" aria-label="Previous post">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
      </button>
      <button class="iconbtn" id="canvasNext" type="button" aria-label="Next post">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </button>
      <button class="iconbtn" id="canvasClose" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <div class="canvas-body">
      <div class="canvas-stage" id="canvasStage"></div>
      <aside class="canvas-rail" id="canvasRail" aria-label="This post"></aside>
    </div>
  </div>
</div>

<div class="qr-modal" id="qrModal">
  <div class="qr-card">
    <h3>Review on mobile</h3>
    <p>Scan to open this page on a mobile device.</p>
    <div id="qrTarget"></div>
    <button class="btn" id="qrClose" type="button">Close</button>
  </div>
</div>

<script src="/js/review.js?v=20260920c"></script>
</body>
</html>
