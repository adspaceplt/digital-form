# The portal's database, kept every night at 02:37 MYT (workers/db-backup).
# Runs only on its schedule or when started by hand from the Actions tab,
# never on a pull request, so its secrets never reach a fork.
name: Database backup

on:
  schedule:
    - cron: '37 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Pinned (2026-10-17, audit I): the version the nightly runs used when
      # this was written; a new release is taken by changing this line.
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.121.0
      - name: Dump, encrypt and keep
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET: myadspace
          S3_REGION: ap-southeast-5
        run: bash workers/db-backup/backup.sh
