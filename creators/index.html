<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADspace Creator Selection</title>
<meta name="description" content="Choose the creators for your campaign.">
<meta property="og:site_name" content="ADspace">
<meta property="og:title" content="Creator Selection by ADspace">
<meta property="og:description" content="The creators we have sourced for your campaign. Open each profile, then choose the ones you want.">
<meta property="og:image" content="https://mycdn.adspace.me/adspace-favicon.png">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/png" href="https://mycdn.adspace.me/adspace-favicon.png">
<link rel="apple-touch-icon" href="https://mycdn.adspace.me/adspace-favicon.png">
<link rel="stylesheet" href="/css/portal.css?v=20260913b">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/js/config.js?v=20260913b"></script>
<script src="/js/api.js?v=20260913b"></script>
<script src="/js/money.js?v=20260913b"></script>
</head>
<body>

<!-- Header and footer come from the shared chrome, so a new page gets them
     by including one script rather than copying this markup. -->
<script src="/js/chrome.js?v=20260913b" data-kicker="Creator Selection" data-for data-actions="lang"></script>

<main class="shell">

  <!-- The same cover as the review page: centred, the page white to the
       edges, the footer on the floor. -->
  <section class="cover" id="stateBox" hidden>
    <div class="cover-inner">
      <div class="cover-panel">
        <h2 id="stateTitle"></h2>
        <p id="stateText"></p>
        <form id="passRow" hidden onsubmit="return false">
          <input class="input" id="passInput" type="password" placeholder="Access code" autocomplete="off">
          <button class="btn btn-primary" id="passGo" type="button">Open</button>
        </form>
        <div class="msg" id="stateMsg"></div>
      </div>
    </div>
  </section>

  <div id="app" hidden>

    <div class="camphead">
      <h1 id="campTitle"></h1>
      <p class="camphead-purpose" id="campPurpose" hidden></p>
      <p id="campBrief"></p>
      <!-- The date is the one thing on the page with a consequence, so it is
           drawn as a pill and not left as a line of grey text. -->
      <section class="engage-card" id="engageCard">
        <dl class="booking-facts" id="engageFacts"></dl>
        <!-- The amount is folded away. Campaigns get shown on a screen in a
             meeting, and the billing figure is not always for that room. -->
        <div class="amountfold" id="amountFold" hidden>
          <div class="amountfold-head">
            <button class="amountfold-btn" id="amountToggle" type="button" aria-expanded="false" aria-controls="bookedTotals">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
              <span id="amountLabel"></span>
            </button>
            <a class="amountfold-link" id="amountPdf" target="_blank" rel="noopener" hidden></a>
          </div>
          <div class="totals" id="bookedTotals" hidden></div>
        </div>
      </section>
    </div>

    <!-- Progress. Determinate, because the slot count is known, and phrased as
         what is left to do rather than as a tally. -->
    <section class="progress-card" id="progressCard">
      <div class="progress-top">
        <b id="progLabel"></b>
        <span class="muted" id="progCount"></span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progFill"></div></div>
      <p class="progress-say" id="progSay"></p>
      <p class="progress-say progress-backup" id="progBackup" hidden></p>
      <div class="progress-new" id="progNew" hidden>
        <span id="progNewText"></span>
        <button class="linkbtn" id="progNewBtn" type="button"></button>
      </div>
    </section>

    <!-- Confirmed bookings and where each has got to. Short chips only: a
         client wants to know whether it is their turn, not our vocabulary. -->
    <section id="bookingWrap" hidden>
      <h2 class="sectionhead" id="bookingHead"></h2>
      <!-- Totals across every live post, the same figures the console adds up. -->
      <section class="rollup-card" id="clientRollup" hidden>
        <div class="rollup-head" id="rollupHead"></div>
        <div class="tally" id="clientTally"></div>
      </section>
      <div id="bookingList"></div>
    </section>

    <h2 class="sectionhead" id="chooseHead" hidden></h2>
    <p class="listhint" id="chooseHint" hidden></p>
    <div class="clist" id="optionGrid"></div>

    <div class="confirmbar" id="confirmBar">
      <div class="confirmbar-in">
        <span id="confirmSummary"></span>
        <button class="btn btn-primary" id="confirmBtn" type="button"></button>
      </div>
    </div>
  </div>
</main>

<div class="sheet" id="confirmSheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true">
    <div class="sheet-head">
      <h3 id="confirmHeading"></h3>
      <button class="iconbtn" id="confirmClose" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <p class="hint" id="confirmBlurb"></p>
    <div id="confirmList" class="sheet-body"></div>
    <div class="totals" id="confirmTotals"></div>
    <label class="field-label" for="confirmName" id="confirmNameLabel"></label>
    <input class="input" id="confirmName" placeholder="">
    <div class="row" style="margin-top:14px;margin-bottom:14px">
      <button class="btn btn-primary" id="confirmGo" type="button"></button>
      <button class="btn" id="confirmCancel" type="button" style="flex:0 0 auto"></button>
    </div>
    <div class="msg" id="confirmMsg"></div>
  </div>
</div>

<div class="sheet" id="draftSheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true">
    <div class="sheet-head">
      <h3 id="draftHeading"></h3>
      <button class="iconbtn" id="draftClose" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <p class="hint" id="draftBlurb"></p>
    <a class="btn btn-icon" id="draftOpen" target="_blank" rel="noopener"></a>
    <label class="field-label" for="draftNote" style="margin-top:16px" id="draftNoteLabel"></label>
    <textarea class="input textarea" id="draftNote" rows="4"></textarea>
    <label class="field-label" for="draftBy" style="margin-top:12px" id="draftByLabel"></label>
    <input class="input" id="draftBy">
    <div class="row" style="margin-top:14px;margin-bottom:14px">
      <button class="btn btn-go" id="draftApprove" type="button"></button>
      <button class="btn btn-warn" id="draftChanges" type="button"></button>
      <button class="btn" id="draftCancel" type="button" style="flex:0 0 auto"></button>
    </div>
    <div class="msg" id="draftMsg"></div>
  </div>
</div>

<script src="/js/creators.js?v=20260913b"></script>
</body>
</html>
