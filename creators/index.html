<!DOCTYPE html>
<html lang="en" data-face="client" data-layout="shaded">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>ADspace Creator Selection</title>
<meta name="description" content="Select the creators for your campaign.">
<meta property="og:site_name" content="ADspace">
<meta property="og:title" content="Creator Selection by ADspace">
<meta property="og:description" content="The creators proposed for your campaign. Please review each profile and select your creators.">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/png" sizes="192x192" href="/img/favicon-192.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<!-- Installable, so an iPhone can take its notifications (js/push.js). No start_url in
     it: the page is installed at its own address, the link that proves it. -->
<link rel="manifest" href="/creators/manifest.webmanifest">
<!-- The one brand face, fetched alongside the stylesheet rather than after
     it: a heading that paints in the system face and flips a moment later
     is the page correcting itself in front of the reader. -->
<link rel="preload" as="font" type="font/woff2" href="/css/SlateRg.woff2" crossorigin>
<link rel="stylesheet" href="/css/portal.css?v=20261126v3b">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<!-- The demo (js/demo.js): sample data in place of the database while `adspace-demo` stands,
     for the demo's own links alone (a key holding 0, which no real key does). -->
<script>try{var dm=JSON.parse(localStorage.getItem('adspace-demo')||'null');var dk=/^\/(client|verify)\//.test(location.pathname)||/[?&]k=demo0/i.test(location.search)||(/^\/creator\//.test(location.pathname)&&!/[?&]k=/.test(location.search)&&/^DEMO0/.test(localStorage.getItem('adspace-creator')||''));if(dm&&dm.until>Date.now()&&dk){window.ADSPACE_DEMO=dm;document.write('<script src="/demo/seed.js?v=20261121zb"><\/script><script src="/demo/engine.js?v=20261126f8"><\/script>');}}catch(e){}</script>
<script src="/js/config.js?v=20261126ge"></script>
<script src="/js/demo.js?v=20261121qse"></script>
<script src="/js/words.js?v=20261126ga"></script>
<script src="/js/clock.js?v=20261125ct"></script>
<script src="/js/grow.js?v=20261117zzzf"></script>
<script src="/js/decide.js?v=20261117zzzf"></script>
<script src="/js/sheet.js?v=20261125ar"></script>
<script src="/js/state.js?v=20261117zzzf"></script>
<script src="/js/api.js?v=20261126rfd"></script>
<script src="/js/maintenance.js?v=20261125ct"></script>
<script src="/js/announce.js?v=20261126rfd"></script>
<script src="/js/menu.js?v=20261126lo"></script>
<script src="/js/guide.js?v=20261117zzzf"></script>
<script src="/js/push.js?v=20261117zzzf"></script>
<script src="/js/money.js?v=20261126rfc"></script>
</head>
<body class="qs-page">

<!-- Header and footer come from the shared chrome, so a new page gets them
     by including one script rather than copying this markup. -->
<script src="/js/chrome.js?v=20261122zzzs" data-kicker="Creator Selection" data-for data-actions="push lang"></script>

<main class="shell">
  <div class="pageload" role="status" aria-label="Loading"><span class="pageload-spin" aria-hidden="true"></span></div>

  <!-- The same cover as the review page: centred, the page white to the
       edges, the footer on the floor. -->
  <section class="cover" id="stateBox" data-shown hidden>
    <div class="cover-inner">
      <div class="cover-panel">
        <h2 id="stateTitle"></h2>
        <p id="stateText"></p>
        <form id="passRow" hidden onsubmit="return false">
          <input class="input" id="passInput" type="password" placeholder="Access code" autocomplete="off" aria-label="Access code">
          <button class="btn btn-primary" id="passGo" type="button">Open</button>
        </form>
        <div class="msg" id="stateMsg"></div>
      </div>
    </div>
  </section>

  <div id="app" data-shown hidden>

    <!-- The head (2026-11-26): the client portal's head shape on a shaded
         card, the client's mark, the campaign over its client and its state
         at the right. Then a shaded card a section, each titled inside it
         (docs/rules/creator-campaigns.md, the selection page). -->
    <section class="sumcard rec-head cs-head" id="campHead">
      <div class="rec-id">
        <span class="rec-mark" id="campMark" aria-hidden="true"></span>
        <div class="rec-who">
          <div class="rec-name"><h1 id="campTitle"></h1></div>
          <p class="rec-id-meta" id="campMeta"></p>
        </div>
        <div class="rec-ctl"><span class="chip-state" id="campState" hidden></span></div>
      </div>
    </section>
    <!-- Summary: Choose by, Creators and the invoice, then where the
         campaign stands (n of N posted, the next shoot, a bar part a
         creator and the counts). -->
    <section class="sumcard cs-summary" id="campSummary" hidden>
      <div class="sumcard-head"><h2 id="summaryHead"></h2></div>
      <dl class="cs-facts" id="csFacts"></dl>
      <div class="cx-standing" id="campStanding" hidden></div>
    </section>
    <!-- The brief, never folded. -->
    <section class="sumcard cs-brief" id="campBriefBox" hidden>
      <div class="sumcard-head"><h2 id="briefHead"></h2></div>
      <div class="cs-brief-text">
        <p class="cs-purpose" id="campPurpose" hidden></p>
        <p id="campBrief"></p>
      </div>
    </section>
    <!-- A draft waiting on the client leads the page. -->
    <div class="cx-needs" id="needBox" hidden></div>
    <!-- The amount: its own card, the figure behind the title's chevron.
         Campaigns get shown on a screen in a meeting, and the billing figure
         is not always for that room. -->
    <section class="sumcard cs-amount" id="amountFold" hidden>
      <div class="sumcard-head">
        <h2><button class="amountfold-btn" id="amountToggle" type="button" aria-expanded="false" aria-controls="bookedTotals">
          <span id="amountLabel"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
        </button></h2>
        <a class="amountfold-link" id="amountPdf" target="_blank" rel="noopener" hidden></a>
      </div>
      <div class="msg err" id="amountMsg" role="status" hidden></div>
      <div class="totals" id="bookedTotals" hidden></div>
    </section>
    <!-- Totals across every live post, the same figures the console adds up. -->
    <section class="sumcard rollup-card" id="clientRollup" hidden>
      <div class="sumcard-head rollup-head" id="rollupHead"></div>
      <div class="cx-results" id="clientTally"></div>
    </section>
    <!-- Creators: their title over a shaded card a creator, each folded to
         its name, state and next date. -->
    <section class="cs-creators" id="bookingWrap" hidden>
      <div class="sumcard-head cs-sechead"><h2 id="bookingHead"></h2><span class="tab-n" id="bookingCount"></span></div>
      <div id="bookingList"></div>
    </section>
    <h2 class="sectionhead" id="chooseHead" hidden></h2>
    <p class="listhint" id="chooseHint" hidden></p>

    <!-- The creators to choose from beside the cart (1.618 : 1 at a desk);
         on a phone the cart is the bar at the foot and its sheet. -->
    <div class="cs-body" id="csBody" hidden>
      <div class="cs-main">
        <div class="actstrip seg-strip"><div class="cmdbar-views actviews" id="csStrip" role="group"></div></div>
        <div class="cs-grid" id="optionGrid"></div>
      </div>
      <aside class="sumcard cs-cart" id="csCart" aria-labelledby="cartHeading">
        <div class="cs-cart-head">
          <span class="cs-cart-ic" id="cartIc" aria-hidden="true"></span>
          <h2 id="cartHeading"></h2>
          <span class="tab-n" id="progCount"></span>
          <button class="iconbtn cs-cart-close" id="cartClose" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <p class="cs-say" id="progSay"></p>
        <ul class="cs-lines" id="cartLines"></ul>
        <p class="cs-backups" id="cartBackup" hidden></p>
        <p class="cs-say cs-mute" id="progBackup" hidden></p>
        <div class="totals cs-totals" id="cartTotals"></div>
        <p class="cs-say cs-mute" id="cartChanged" hidden></p>
        <button class="btn btn-primary cs-submit" id="confirmBtn" type="button"></button>
      </aside>
    </div>

    <!-- The cart on a phone: fixed at the foot, above the safe area. -->
    <div class="cs-bar" id="confirmBar" hidden>
      <div class="cs-bar-in">
        <p class="cs-bar-sum" id="confirmSummary"></p>
        <div class="cs-bar-acts">
          <button class="btn" id="cartOpen" type="button"></button>
          <button class="btn btn-primary" id="barSubmit" type="button"></button>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- The cart's own sheet on a phone: View selection carries the cart in. -->
<div class="sheet cs-cartsheet" id="cartSheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="cartHeading">
    <div class="sheet-body" id="cartSheetBody"></div>
  </div>
</div>

<div class="sheet" id="confirmSheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="confirmHeading">
    <div class="sheet-head">
      <h3 id="confirmHeading"></h3>
      <button class="iconbtn" id="confirmClose" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <p class="hint" id="confirmBlurb"></p>
    <div id="confirmList" class="sheet-body"></div>
    <div class="totals" id="confirmTotals"></div>
    <label class="field-label" for="confirmName" id="confirmNameLabel"></label>
    <input class="input" id="confirmName" maxlength="80" placeholder="">
    <div class="msg" id="confirmMsg"></div>
    <div class="sheet-foot">
      <button class="btn btn-primary" id="confirmGo" type="button"></button>
      <button class="btn btn-quiet" id="confirmCancel" type="button"></button>
    </div>
  </div>
</div>

<script src="/js/icons.js?v=20261125ct"></script>
<script src="/js/media.js?v=20261117zzzf"></script>
<script src="/js/creators.js?v=20261126cp7"></script>
</body>
</html>
