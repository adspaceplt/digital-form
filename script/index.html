<!-- The demo (js/demo.js): sample data in place of the database while `adspace-demo` stands,
     for the demo's own links alone (a key holding 0, which no real key does). -->
<script>try{var dm=JSON.parse(localStorage.getItem('adspace-demo')||'null');var dk=/^\/client\//.test(location.pathname)||/[?&]k=demo0/i.test(location.search)||(/^\/creator\//.test(location.pathname)&&!/[?&]k=/.test(location.search)&&/^DEMO0/.test(localStorage.getItem('adspace-creator')||''));if(dm&&dm.until>Date.now()&&dk){window.ADSPACE_DEMO=dm;document.write('<script src="/demo/seed.js?v=20261027j"><\/script><script src="/demo/engine.js?v=20261027m"><\/script>');}}catch(e){}</script>

<!-- Header and footer come from the shared chrome. -->
<script src="/js/chrome.js?v=20261017" data-kicker="Video Scripts"></script>

<main class="shell shell-script">
  <div class="pageload" role="status" aria-label="Loading"><span class="pageload-spin" aria-hidden="true"></span></div>
  <!-- Who the page is for, as the review page says it: the mark, the name
       and how many scripts; then a tab a content month. -->
  <section class="panel rec-head" id="vsHead" data-shown hidden>
    <div class="rec-id">
      <span class="rec-mark" id="vsMark" aria-hidden="true"></span>
      <div class="rec-who">
        <div class="rec-name"><h2 id="vsName"></h2></div>
        <p class="rec-id-meta" id="vsMeta"></p>
      </div>
    </div>
  </section>
  <nav class="tabrow stagestrip" id="vsStages" role="tablist" aria-label="Content month" hidden></nav>
  <div id="vsContent" data-swipe="vsStages" data-narrow="640"></div>

  <section class="cover" id="cover" data-shown hidden>
    <div class="cover-inner">
      <div class="cover-panel">
        <h2 id="coverTitle">Video Scripts</h2>
        <p id="coverBody"></p>
      </div>
    </div>
  </section>
</main>

<script src="/js/swipe.js?v=20261001a"></script>
<script src="/js/script.js?v=20261027d"></script>
