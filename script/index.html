<!DOCTYPE html>
<html lang="en" data-face="client">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>ADspace Video Scripts</title>
<!-- What a link unfurls to: the half that is true of every client, since a
     crawler runs no scripts; the page puts the client's name in front once
     it loads. -->
<meta name="description" content="Video scripts prepared by ADspace.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="ADspace">
<meta property="og:title" content="Video Scripts by ADspace">
<meta property="og:description" content="Each video's script as it will be shot.">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Video Scripts by ADspace">
<meta name="twitter:description" content="Each video's script as it will be shot.">
<link rel="icon" type="image/png" sizes="192x192" href="/img/favicon-192.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="preload" as="font" type="font/woff2" href="/css/SlateRg.woff2" crossorigin>
<link rel="stylesheet" href="/css/portal.css?v=20261015">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/js/config.js?v=20261014a"></script>
<script src="/js/words.js?v=20261009s"></script>
<script src="/js/clock.js?v=20261012b"></script>
<script src="/js/grow.js?v=20261008"></script>
<script src="/js/state.js?v=20261001a"></script>
<script src="/js/form.js?v=20261013"></script>
<script src="/js/menu.js?v=20261009g"></script>
<script src="/js/guide.js?v=20261014j"></script>
<script src="/js/api.js?v=20261010zn"></script>
<script src="/js/maintenance.js?v=20261009h"></script>
<script src="/js/announce.js?v=20261011a"></script>
</head>
<body>

<!-- Header and footer come from the shared chrome. -->
<script src="/js/chrome.js?v=20261012b" data-kicker="Video Scripts" data-for></script>

<main class="shell shell-script">
  <!-- Who the page is for, as the review page says it: the mark, the name
       and how many scripts; then a tab a content month. -->
  <section class="panel rec-head" id="vsHead" hidden>
    <div class="rec-id">
      <span class="rec-mark" id="vsMark" aria-hidden="true"></span>
      <div class="rec-who">
        <div class="rec-name"><h2 id="vsName"></h2></div>
        <p class="rec-id-meta" id="vsMeta"></p>
      </div>
    </div>
  </section>
  <nav class="tabrow stagestrip" id="vsStages" role="tablist" aria-label="Content month" hidden></nav>
  <div id="vsContent" data-swipe="vsStages" data-narrow="640"></div>

  <section class="cover" id="cover" hidden>
    <div class="cover-inner">
      <div class="cover-panel">
        <h2 id="coverTitle">Video Scripts</h2>
        <p id="coverBody"></p>
      </div>
    </div>
  </section>
</main>

<script src="/js/swipe.js?v=20261001a"></script>
<script src="/js/script.js?v=20261012a"></script>
</body>
</html>
